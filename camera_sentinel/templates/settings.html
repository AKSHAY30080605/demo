{% extends "base.html" %}{% block content %}
<div class="grid g2">
<div class="card"><h3><i data-lucide="settings"></i> Settings</h3>
 <label>Abnormal threshold (display)</label><input id="thr" type="number" step="0.05">
 <label>Capture interface</label><input id="iface">
 <label>Retention (days)</label><input id="ret" type="number">
 <button class="btn primary" id="save" style="margin-top:12px"><i data-lucide="save"></i> Save</button></div>
<div class="card"><h3><i data-lucide="cpu"></i> System Health</h3>
 <div class="kv"><span>CPU</span><b id="cpu">—</b></div><div class="kv"><span>RAM</span><b id="ram">—</b></div>
 <div class="kv"><span>Disk</span><b id="disk">—</b></div><div class="kv"><span>CPU temp</span><b id="temp">—</b></div>
 <div class="kv"><span>Hostname</span><b id="host">—</b></div>
 <h3 style="margin-top:14px"><i data-lucide="bug"></i> Cowrie</h3>
 <div class="kv"><span>Status</span><b id="cow">—</b></div>
 <h3 style="margin-top:14px"><i data-lucide="shield-check"></i> Lab allowlist</h3><div id="allow" class="muted"></div></div>
</div>
{% endblock %}{% block script %}<script>
async function load(){const r=await api('/api/settings');const s=r.settings;
 thr.value=s.threshold||0.5;iface.value=s.capture_interface||'{{ cfg.CAPTURE_INTERFACE }}';ret.value=s.retention_days||7;
 const sy=r.system;cpu.textContent=(sy.cpu_percent??'—')+'%';ram.textContent=(sy.ram_percent??'—')+'%';disk.textContent=(sy.disk_percent??'—')+'%';temp.textContent=sy.temp_c?sy.temp_c+'°C':'—';host.textContent=sy.hostname;
 cow.innerHTML=r.cowrie.running?'<span class="good">running</span>':'<span class="err">stopped</span>';
 $('#allow').innerHTML=r.lab_allowlist.map(a=>`<span class="badge b-info" style="margin:3px">${a}</span>`).join('');}
$('#save').onclick=async()=>{await apiPost('/api/settings',{threshold:thr.value,capture_interface:iface.value,retention_days:ret.value});toast('settings saved');}
load();
</script>{% endblock %}
