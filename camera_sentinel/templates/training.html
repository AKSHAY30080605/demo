{% extends "base.html" %}{% block content %}
<div class="flex-split">
<div class="card" style="flex:1">
  <h3><i data-lucide="cpu"></i> Train XGBoost Model</h3>
  <label>Dataset</label><select id="ds"></select>
  <label>Target column</label>
  <select id="target"><option value="attack">attack (binary 0/1)</option><option value="type_of_attack">type_of_attack (multiclass)</option></select>
  <label>Feature set</label>
  <select id="featmode"><option value="canonical">Canonical schema (recommended)</option><option value="custom">Custom (pick below)</option></select>
  <div id="featbox" style="display:none;margin-top:8px"></div>
  <label>Split method</label>
  <select id="split"><option value="stratified">Stratified random</option><option value="group">Group (by uid)</option><option value="time">Time-based (by ts)</option></select>
  <div class="grid g2">
    <div><label>Row cap (Pi memory)</label><input id="rowcap" type="number" value="150000"></div>
    <div><label>Test size</label><input id="testsize" type="number" step="0.05" value="0.2"></div>
    <div><label>n_estimators</label><input id="nest" type="number" value="200"></div>
    <div><label>max_depth</label><input id="depth" type="number" value="5"></div>
    <div><label>learning_rate</label><input id="lr" type="number" step="0.01" value="0.1"></div>
    <div><label>&nbsp;</label><label class="row" style="margin:0"><input type="checkbox" id="cw" style="width:auto" checked> class weighting</label></div>
  </div>
  <div class="row" style="margin-top:12px">
    <button class="btn primary" id="go"><i data-lucide="play"></i> Start training</button>
    <span id="st"></span>
  </div>
</div>
<div class="card" style="flex:1"><h3><i data-lucide="terminal"></i> Training Log</h3>
  <pre class="log" id="log">Idle. Pick a dataset and start.</pre>
  <div id="result"></div>
</div></div>
{% endblock %}{% block script %}<script>
async function loadDs(){const r=await api('/api/datasets');const s=$('#ds');s.innerHTML='';
 if(!r.datasets.length){s.innerHTML='<option>— upload a dataset first —</option>';return;}
 r.datasets.forEach(d=>s.appendChild(el('option',null,`#${d.id} ${d.name} (${(d.rows||0).toLocaleString()} rows)`))||(s.lastChild.value=d.id));
 [...s.options].forEach((o,i)=>o.value=r.datasets[i].id);}
$('#featmode').onchange=async()=>{if($('#featmode').value=='custom'){const s=await api('/api/schema');
 $('#featbox').style.display='block';$('#featbox').innerHTML=s.canonical.map(f=>`<label class="row" style="margin:2px"><input type=checkbox class=feat value="${f}" checked style="width:auto"> ${f}</label>`).join('');}else $('#featbox').style.display='none';};
let poll=null;
$('#go').onclick=async()=>{const dsid=$('#ds').value;if(!dsid||isNaN(+dsid)){toast('upload & pick a dataset','err');return;}
 const feats=$('#featmode').value=='custom'?$$('.feat:checked').map(c=>c.value):null;
 const body={dataset_id:+dsid,target:$('#target').value,split_method:split.value,row_cap:+rowcap.value,test_size:+testsize.value,
  n_estimators:+nest.value,max_depth:+depth.value,learning_rate:+lr.value,class_weight:cw.checked,multiclass:$('#target').value=='type_of_attack',features:feats};
 $('#go').disabled=true;$('#st').innerHTML='<span class="spin"></span> running';$('#result').innerHTML='';
 const r=await apiPost('/api/training/start',body);if(!r.ok){toast(r.error,'err');$('#go').disabled=false;$('#st').textContent='';return;}
 poll=setInterval(()=>check(r.job_id),1200);}
async function check(id){const j=await api('/api/training/'+id);if(!j.ok)return;
 $('#log').textContent=(j.log||[]).join('\n');
 if(j.status=='done'||j.status=='error'){clearInterval(poll);$('#go').disabled=false;$('#st').textContent='';
  if(j.status=='error'){$('#result').innerHTML='<div class="alert err">'+((j.result&&j.result.error)||'failed — see log')+'</div>';return;}
  const m=j.result.metrics;const cm=m.confusion_matrix;
  $('#result').innerHTML=`<div class="alert ok">Model ${j.result.version} trained. Activate it on the Evaluation page.</div>
   <div class="grid g4"><div class="card stat"><span class="num teal">${(m.accuracy*100).toFixed(1)}%</span><span class="lbl">accuracy</span></div>
   <div class="card stat"><span class="num">${(m.precision*100).toFixed(1)}%</span><span class="lbl">precision</span></div>
   <div class="card stat"><span class="num">${(m.recall*100).toFixed(1)}%</span><span class="lbl">recall</span></div>
   <div class="card stat"><span class="num">${(m.f1*100).toFixed(1)}%</span><span class="lbl">F1</span></div></div>
   <p class="muted" style="margin-top:8px">Split: ${m.split_method} · test rows: ${m.test_rows} · classes: ${JSON.stringify(m.test_class_counts)}</p>`;}
}
$('#target').onchange=()=>{};
loadDs();
</script>{% endblock %}
